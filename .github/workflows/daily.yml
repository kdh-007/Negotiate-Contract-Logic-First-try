name: 협상공고 일일 수집

# 실행 방법
#  · 수동: GitHub 저장소 → Actions 탭 → 이 워크플로 선택 → "Run workflow"
#  · 자동 스케줄은 2026-09-23 사용자 요청으로 껐다 — 필요할 때 수동으로만 돌린다.
#    (다시 켜려면 위 "수동" 줄을 지우고 schedule: 블록을 되살리면 됨 — git 이력에 남아있음)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "조회 기간(일). 비우면 1일"
        required: false
        default: "1"
      no_supabase:
        description: "true로 두면 Supabase에 저장하지 않고 리포트만 생성"
        required: false
        default: "false"
      attempt:
        description: "재시도 회차 (자동 재시도가 채워넣는 값 — 직접 실행할 땐 비워두면 1)"
        required: false
        default: "1"
      verify:
        description: "true로 두면 수집 대신 `nego --verify`(응답 필드명 진단)만 실행하고 끝낸다"
        required: false
        default: "false"

# 실패 시 같은 워크플로를 workflow_dispatch로 재호출해 새 Run을 큐에 올리려면
# GITHUB_TOKEN에 actions:write 권한이 있어야 한다.
permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # days를 30일보다 길게 잡으면 API 조회가 여러 번(30일 단위)으로 나뉘어
    # 그만큼 오래 걸린다 — 실측 30일 기준 약 26분이라 여유 있게 잡는다.
    timeout-minutes: 90

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m unittest discover -s tests -t .

      # 필드명이 비어 보이거나(예: 예가방법에 해당하는 실제 필드명을 모를 때)
      # 원본 응답을 직접 봐야 할 때 쓰는 1회성 진단. 이 스텝을 타면 아래
      # 수집 실행/업로드는 건너뛴다 — Supabase에 아무것도 쓰지 않는다.
      - name: API 필드명 진단 (verify=true일 때만)
        if: github.event.inputs.verify == 'true'
        env:
          NARA_SERVICE_KEY: ${{ secrets.NARA_SERVICE_KEY }}
        run: python -m nego --verify

      - name: 수집 실행
        id: collect
        if: github.event.inputs.verify != 'true'
        continue-on-error: true
        env:
          NARA_SERVICE_KEY: ${{ secrets.NARA_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          # 후보 공고 첨부파일(HWP/HWPX/PDF)까지 매일 자동으로 텍스트 추출한다
          # (지역제한/면허제한/공동수급을 원문과 대조하기 위함). 담당자 연락처는
          # nego/attachments.py가 저장 전에 마스킹한다.
          ARGS="--fetch-attachment-text"
          if [ "${{ github.event.inputs.no_supabase }}" = "true" ]; then
            ARGS="$ARGS --no-supabase"
          fi
          python -m nego $ARGS

      # 수집 원문(data/)은 올리지 않는다 — 담당자 연락처가 섞일 수 있다.
      # 리포트(output/)만 아티팩트로 남긴다.
      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nego-report-${{ github.run_id }}
          path: output/
          retention-days: 90
          if-no-files-found: ignore

      # 용역/물품/공사 중 하나라도 API 재시도(5회)를 다 소진하면 nego/pipeline.py가
      # 전체 실행을 실패로 처리한다(부분 데이터로 리포트를 내지 않는다). 그럴 때
      # 이 Run은 실패로 끝내고, 같은 입력값으로 새 Run을 자동 큐잉해 재시도한다.
      # attempt를 5회로 제한해 API가 계속 죽어있을 때 무한 재시도하지 않는다.
      - name: 실패 시 새 Run 재시도 예약
        if: steps.collect.outcome == 'failure' && fromJSON(github.event.inputs.attempt || '1') < 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_ATTEMPT=$(( ${{ github.event.inputs.attempt || '1' }} + 1 ))
          echo "수집 실패 — ${NEXT_ATTEMPT}번째 시도로 새 Run을 큐에 올립니다."
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"days\":\"${{ github.event.inputs.days || '1' }}\",\"no_supabase\":\"${{ github.event.inputs.no_supabase || 'false' }}\",\"attempt\":\"${NEXT_ATTEMPT}\"}}"

      - name: 재시도 소진 알림
        if: steps.collect.outcome == 'failure' && !(fromJSON(github.event.inputs.attempt || '1') < 5)
        run: echo "::error::${{ github.event.inputs.attempt || '1' }}번째 시도에서도 실패 — 최대 재시도(5회) 소진, 자동 재시도를 중단합니다."

      - name: 실패 처리
        if: steps.collect.outcome == 'failure'
        run: exit 1
