name: 협상공고 일일 수집

# 실행 방법
#  · 자동: 매일 08:00 KST
#  · 수동: GitHub 저장소 → Actions 탭 → 이 워크플로 선택 → "Run workflow"
on:
  schedule:
    # GitHub Actions의 cron은 UTC 기준이다. 08:00 KST = 23:00 UTC (전날)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "조회 기간(일). 비우면 1일"
        required: false
        default: "1"
      no_supabase:
        description: "true로 두면 Supabase에 저장하지 않고 리포트만 생성"
        required: false
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m unittest discover -s tests -t .

      - name: 수집 실행
        env:
          NARA_SERVICE_KEY: ${{ secrets.NARA_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          if [ "${{ github.event.inputs.no_supabase }}" = "true" ]; then
            python -m nego --no-supabase
          else
            python -m nego
          fi

      # 수집 원문(data/)은 올리지 않는다 — 담당자 연락처가 섞일 수 있다.
      # 리포트(output/)만 아티팩트로 남긴다.
      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nego-report-${{ github.run_id }}
          path: output/
          retention-days: 90
          if-no-files-found: ignore
