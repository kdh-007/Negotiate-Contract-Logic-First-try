name: API 필드명 진단

# 본공고 3종(용역/물품/공사) + 면허제한정보 + 참가가능지역, 각 오퍼레이션의
# 첫 응답 건의 전체 필드 키와 값을 그대로 찍는다. `nego --verify`를 그대로
# 실행한다 — 필드가 비어 보이거나(예: 예가방법에 해당하는 실제 필드명을
# 모를 때) 원본 응답을 직접 봐야 할 때 쓰는 1회성 진단 워크플로.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 진단 실행
        env:
          NARA_SERVICE_KEY: ${{ secrets.NARA_SERVICE_KEY }}
        run: python -m nego --verify
