<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>입찰 공고 싱크로율 탐색기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232f6fed%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">싱</div>
    <div>
      <h1>입찰 공고 싱크로율 탐색기</h1>
      <p class="sub" id="pastInfo">과거 실적 불러오는 중…</p>
    </div>
  </div>
  <div class="top-right">
    <label class="me">내 이름 <input id="myName" maxlength="30" placeholder="예: 김지일" autocomplete="off"></label>
    <div class="theme" role="group" aria-label="테마">
      <button data-theme-set="light">라이트</button><button data-theme-set="dark">다크</button><button data-theme-set="system">시스템</button>
    </div>
  </div>
</header>
<p class="hint">내 이름은 이 브라우저에 기억되고, 참가여부·담당·대화에 표시됩니다.</p>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="live" class="on">실제 공고</button>
  <button role="tab" data-tab="rejected">제외된 공고</button>
  <button role="tab" data-tab="search">직접 검색</button>
  <button role="tab" data-tab="past">과거사업 목록</button>
</nav>

<main>
  <section id="tab-live" class="tab">
    <div class="toolbar">
      <select id="period" aria-label="조회 기간"></select>
      <label class="chk" title="조달청 사전규격정보서비스 — 공공데이터포털 활용신청 필요"><input type="checkbox" id="optPrespec" checked> 사전규격 포함</label>
      <label class="chk"><input type="checkbox" id="optAttach" checked> 첨부 자격판정</label>
      <label class="chk" id="optAiWrap"><input type="checkbox" id="optAi"> AI 판단</label>
      <button class="primary" id="btnCollect">나라장터에서 불러오기</button>
      <button id="btnReload">새로 조회</button>
      <span class="job" id="jobStatus"></span>
    </div>
    <pre class="joblog" id="jobLog" hidden></pre>
    <div class="filters" id="filters"></div>
    <p class="summary" id="summary"></p>
    <div id="liveList"></div>
  </section>

  <section id="tab-rejected" class="tab" hidden>
    <p class="summary" id="rejSummary"></p>
    <div id="rejList"></div>
  </section>

  <section id="tab-search" class="tab" hidden>
    <div class="searchbox">
      <input id="qText" placeholder="수집된 공고에서 검색 — 공고명·수요기관·공고번호" autocomplete="off">
    </div>
    <div id="searchList"></div>
    <details class="manual">
      <summary>공고 원문으로 싱크로율 직접 계산</summary>
      <input id="mTitle" placeholder="공고명">
      <textarea id="mText" rows="8" placeholder="제안요청서·과업지시서 본문을 붙여넣기 (없으면 공고명만으로 계산 — 정확도 낮음)"></textarea>
      <button class="primary" id="btnMatch">계산</button>
      <div id="matchResult"></div>
    </details>
  </section>

  <section id="tab-past" class="tab" hidden>
    <div class="toolbar">
      <input id="pastQ" placeholder="사업명·과업·전시내용 검색" autocomplete="off">
      <select id="pastYear"><option value="">전체 연도</option></select>
    </div>
    <div id="pastList"></div>
  </section>
</main>

<dialog id="thread">
  <form method="dialog" class="dlg-head"><strong id="threadTitle"></strong><button aria-label="닫기">✕</button></form>
  <div id="threadBody" class="thread-body"></div>
  <div class="thread-new">
    <textarea id="threadInput" rows="2" placeholder="메시지 입력 (Ctrl+Enter 전송)"></textarea>
    <button class="primary" id="threadSend">보내기</button>
  </div>
</dialog>

<dialog id="detail">
  <form method="dialog" class="dlg-head"><strong id="detailTitle"></strong><button aria-label="닫기">✕</button></form>
  <div id="detailBody" class="detail-body"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
